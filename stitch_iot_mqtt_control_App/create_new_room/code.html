<!-- BottomNavBar (Hidden on MD up, destination rule applies: assuming part of a settings/setup flow, but instructions say generic "create room". We will render it but not highlight it as active since it's a sub-page, wait, instruction says "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional... Task-Focused: Any sub-page featuring a "Close" or "Back" action that implies a temporary departure from the main navigation flow." Since this has a back button, we suppress the bottom nav bar entirely). -->
<script>
        // Simple script to handle icon selection toggle
        document.addEventListener('DOMContentLoaded', () => {
            const iconCards = document.querySelectorAll('.icon-card');
            
            iconCards.forEach(card => {
                card.addEventListener('click', (e) => {
                    // Remove selected from all
                    iconCards.forEach(c => {
                        c.classList.remove('selected');
                        const icon = c.querySelector('.material-symbols-outlined');
                        icon.classList.add('text-on-surface-variant');
                        icon.classList.remove('text-black');
                    });
                    
                    // Add to clicked
                    card.classList.add('selected');
                    const icon = card.querySelector('.material-symbols-outlined');
                    icon.classList.remove('text-on-surface-variant');
                    icon.classList.add('text-black');
                });
            });
        });
    </script>
