name: Deploy to AWS App Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: smartnest-backend
  APP_RUNNER_SERVICE: smartnest-api

jobs:
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "✅ Docker image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Trigger AWS App Runner Deployment
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ROLE_ARN: ${{ secrets.APP_RUNNER_ROLE_ARN }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          SERVICE_ARN=$(aws apprunner list-services --region ${{ env.AWS_REGION }} --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE }}'].ServiceArn" --output text)
          echo "Found Service ARN: $SERVICE_ARN"
          echo "Target Image URI: $IMAGE_URI"
          if [ -n "$SERVICE_ARN" ]; then
            set +e
            RETRY=0
            MAX_RETRIES=15
            while [ $RETRY -lt $MAX_RETRIES ]
            do
              echo "Attempting to update AWS App Runner service (Attempt $((RETRY+1))/$MAX_RETRIES)..."
              CMD_OUTPUT=$(aws apprunner update-service --service-arn $SERVICE_ARN --source-configuration "ImageRepository={ImageIdentifier=$IMAGE_URI,ImageRepositoryType=ECR,ImageConfiguration={Port='8000'}},AuthenticationConfiguration={AccessRoleArn='$ROLE_ARN'}" --region ${{ env.AWS_REGION }} 2>&1)
              EXIT_CODE=$?
              
              if [ $EXIT_CODE -eq 0 ]; then
                echo "✅ AWS App Runner service updated with new image!"
                sleep 5
                aws apprunner start-deployment --service-arn $SERVICE_ARN --region ${{ env.AWS_REGION }} || true
                break
              elif echo "$CMD_OUTPUT" | grep -q "OPERATION_IN_PROGRESS"; then
                echo "⏳ App Runner is busy with an in-progress operation. Waiting 20s before retry $((RETRY+1))..."
                sleep 20
                RETRY=$((RETRY+1))
              else
                echo "⚠️ AWS update-service response: $CMD_OUTPUT"
                # If update fails for another reason, try start-deployment directly
                aws apprunner start-deployment --service-arn $SERVICE_ARN --region ${{ env.AWS_REGION }} || true
                break
              fi
            done
            set -e
          else
            echo "⚠️ Could not find Service ARN for ${{ env.APP_RUNNER_SERVICE }}"
          fi

      - name: Deployment Success
        run: |
          echo "🚀 SmartNest API image updated and deployed to AWS App Runner!"
