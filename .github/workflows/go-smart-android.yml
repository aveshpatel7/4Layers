name: Build GO SMART Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/go-smart-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm ci

      - name: Patch Expo SDK 51 for Android 15
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('node_modules/expo-modules-core/android/src/main/java/expo/modules/adapters/react/permissions/PermissionsService.kt')
          s = p.read_text()
          old = 'return requestedPermissions.contains(permission)'
          new = 'return requestedPermissions?.contains(permission) == true'
          if old not in s and new not in s:
              raise SystemExit('Expected Expo permissions line not found')
          if old in s:
              p.write_text(s.replace(old, new))
          print('Expo Android 15 permissions compatibility patch applied')
          PY

      - name: Build release APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload GO SMART APK
        uses: actions/upload-artifact@v4
        with:
          name: GO-SMART-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
