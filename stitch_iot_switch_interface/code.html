<style>
        /* 3D Vertical Rocker Switch Styling */
        .rocker-checkbox:checked + .rocker-inner-v {
            background: linear-gradient(to bottom, rgba(187, 134, 252, 0.25), rgba(187, 134, 252, 0.05));
            box-shadow: 0 0 40px rgba(187, 134, 252, 0.15);
        }
        .rocker-checkbox:checked + .rocker-inner-v .switch-body {
            transform: translateY(10%);

        .rocker-checkbox:not(:checked) + .rocker-inner-v .switch-body {
            transform: translateY(-10%);
        }
        .rocker-checkbox:checked + .rocker-inner-v .indicator-dot {
            background-color: #bb86fc;

        }
        .rocker-checkbox:checked + .rocker-inner-v .label-on {

        }
        .rocker-checkbox:not(:checked) + .rocker-inner-v .label-off {
            color: #bb86fc;
            text-shadow: 0 0 10px rgba(187, 134, 252, 0.6);
            opacity: 1;

        @keyframes slideUp {

            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUp 0.6s ease-out forwards; }

        .dimmer-track::-webkit-slider-runnable-track {
            background: #2a2a2a;
            height: 6px;
            border-radius: 3px;
        }
        .dimmer-track::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #bb86fc;
            margin-top: -7px;
